name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint update.sh
        run: shellcheck update.sh
      - name: Regenerate README (validates row fields)
        run: python3 categorize.py
      - name: README in sync with data (date line exempt)
        run: git diff -I '^Auto-generated from my' --exit-code -- README.md
